name: Runtime benchmarks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out candidate
        uses: actions/checkout@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false
      - name: Check out PR base
        if: github.event_name == 'pull_request'
        uses: actions/checkout@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          node-version: '22.18.0'
          package-manager-cache: false
      - name: Measure with the same harness on the same runner
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          mkdir -p results
          if [ "$IS_PR" = "true" ]; then
            node candidate/scripts/benchmark.js --root baseline --json > results/baseline.json
          fi
          node candidate/scripts/benchmark.js --root candidate --json > results/current.json
      - name: Display benchmark summary
        env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          if [ "$IS_PR" = "true" ]; then
            node candidate/scripts/benchmark-report.js results/current.json results/baseline.json > results/summary.md
          else
            node candidate/scripts/benchmark-report.js results/current.json > results/summary.md
          fi
          cat results/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain raw results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-benchmark-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          retention-days: 30
          if-no-files-found: warn
